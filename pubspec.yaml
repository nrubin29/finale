name: finale
description: A fully-featured Last.fm client
publish_to: 'none'
version: 5.1.3+53

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0 <4.0.0"

dependencies:
  app_links: ^7.2.1
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  collection: ^1.19.1
  cookie_jar: ^4.0.9
  crypto: ^3.0.7
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_acrcloud: ^2.0.1
  flutter_cache_manager: ^3.4.2
  flutter_local_notifications: ^22.3.0
  flutter_mpmediaplayer: ^1.0.0
  flutter_web_auth_2: ^5.1.0
  gal: ^2.3.3
  html: ^0.15.6
  http: ^1.6.0
  in_app_review: ^2.0.12
  intl: ^0.20.3
  json_annotation: ^4.12.0
  material_ui: ^1.0.0
  meta: ^1.19.0
  modal_bottom_sheet: ^3.0.0
  octo_image: ^2.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pkce: ^1.1.0+1
  pool: ^1.5.2
  quick_actions: ^1.1.0
  rxdart: ^0.28.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  universal_io: ^2.3.1
  universal_web: ^1.1.1+1
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0+2
  wakelock_plus: ^1.7.0
  webview_cookie_manager_flutter: ^3.1.0
  webview_flutter: ^4.14.1
  workmanager: ^0.10.7

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  icons_launcher: ^3.1.0
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: SocialMediaIcons
      fonts:
      - asset: assets/fonts/SocialMediaIcons.ttf

# $ dart run icons_launcher:create
icons_launcher:
  image_path: 'assets/images/icon.png'
  platforms:
    android:
      enable: true
      adaptive_background_color: "#ff0000"
      adaptive_foreground_image: 'android/icon_foreground.png'
    web:
      enable: true
